curr:
  deviceClass: ophyd.EpicsSignalRO
  deviceConfig:
    read_pv: ARIDI-PCT:CURRENT
    auto_monitor: true
  readoutPriority: baseline
  description: SLS ring current
  deviceTags: [machine]
